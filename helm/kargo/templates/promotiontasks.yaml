{{- if .Values.kargo.project.enabled }}
---
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: create-git-tag
  namespace: {{ .Values.kargo.project.name }}
spec:
  steps:

  # Step: Clone the repository
  - uses: git-clone
    as: clone-repo
    config:
      repoURL: ${{ "{{" }} vars.repoURL {{ "}}" }}
      checkout:
      - commit: ${{ "{{" }} commitFrom(vars.repoURL).ID {{ "}}" }}
        path: ./src

  # Step: Parse the version
  - uses: yaml-parse
    as: parse-version
    config:
      path: ./src/helm/${{ "{{" }} vars.appName {{ "}}" }}/Chart.yaml
      outputs:
      - name: depVersion
        fromExpression: "dependencies[0].version"
      - name: chartVersion
        fromExpression: version

  # Step: Compose the tag name
  - uses: compose-output
    as: tag-info
    config:
      tagName: ${{ "{{" }} vars.appName {{ "}}" }}-${{ "{{" }} task.outputs['parse-version'].depVersion {{ "}}" }}
  # Step: Create the tag
  - uses: http
    as: create-tag
    config:
      url: ${{ "{{" }} vars.gitApiUrl {{ "}}" }}/repos/${{ "{{" }} vars.gitRepoOwner {{ "}}" }}/${{ "{{" }} vars.gitRepoName {{ "}}" }}/git/refs
      method: POST
      timeout: 10s
      successExpression: "response != nil && response.status == 201"
      headers:
      - name: Authorization
        value: Bearer ${{ "{{" }} vars.gitApiToken {{ "}}" }}
      - name: Accept
        value: application/vnd.github.v3+json
      body: |
        ${{ "{{" }} quote({
          "ref": "refs/tags/" + task.outputs['tag-info'].tagName,
          "sha": commitFrom(vars.repoURL).ID
        }) {{ "}}" }}

---
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: update-applicationset-control
  namespace: {{ .Values.kargo.project.name }}
spec:
  steps:
    # Step 1: Clone the repository at main branch
    - uses: git-clone
      as: clone-repo
      config:
        repoURL: ${{ "{{" }} vars.repoURL {{ "}}" }}
        checkout:
          - branch: main
            path: ./src-control

    # Step 2: Get the tag name from freight (for prod, freight comes from warehouse watching tags)
    - uses: compose-output
      as: tag-info
      config:
        tagName: ${{ "{{" }} commitFrom(vars.repoURL).Tag {{ "}}" }}

    # Step 3: Update app version in controlApps
    - uses: yaml-update
      as: update-prod-values
      config:
        path: ./src-control/values/argo-cd-applicationsets/values.control-prod.yaml
        updates:
          - key: controlApps.${{ "{{" }} vars.appName {{ "}}" }}.appRevision
            value: ${{ "{{" }} task.outputs['tag-info'].tagName {{ "}}" }}

    # Step 4: Commit the changes (only values files, ArgoCD will regenerate ApplicationSets)
    - uses: git-commit
      as: commit-changes
      config:
        path: ./src-control
        message: "chore(${{ "{{" }} vars.appName {{ "}}" }}): update controlApps appRevision to ${{ "{{" }} task.outputs['tag-info'].tagName {{ "}}" }}"

    # Step 5: Generate unique branch name for control
    - uses: compose-output
      as: branch-name
      config:
        branchName: ${{ "{{" }} "kargo/promotion/" + vars.appName + "-prod-control-" + commitFrom(vars.repoURL).ID {{ "}}" }}

    # Step 6: Push the changes to a new branch
    - uses: git-push
      as: push-changes
      config:
        path: ./src-control
        targetBranch: ${{ "{{" }} task.outputs['branch-name'].branchName {{ "}}" }}

    # Step 7: Create Pull Request
    - uses: git-open-pr
      as: create-pr
      config:
        repoURL: ${{ "{{" }} vars.repoURL {{ "}}" }}
        sourceBranch: ${{ "{{" }} task.outputs['branch-name'].branchName {{ "}}" }}
        targetBranch: main
        title: "chore(${{ "{{" }} vars.appName {{ "}}" }}): update controlApps appRevision to ${{ "{{" }} task.outputs['tag-info'].tagName {{ "}}" }}"
        description: "Automated PR to update controlApps ApplicationSet for ${{ "{{" }} vars.appName {{ "}}" }} to tag ${{ "{{" }} task.outputs['tag-info'].tagName {{ "}}" }}"

---
