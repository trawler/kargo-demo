{{- if .Values.kargo.project.enabled }}
---
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: create-git-tag
  namespace: {{ .Values.kargo.project.name }}
spec:
  steps:
    - uses: git-clone
      config:
        repoURL: ${{ "{{" }} vars.repoURL {{ "}}" }}
        checkout:
          - commit: ${{ "{{" }} commitFrom(vars.repoURL).ID {{ "}}" }}
            path: ./src
    
    - uses: yaml-parse
      as: parse-version
      config:
        path: ./src/helm/${{ "{{" }} vars.appName {{ "}}" }}/Chart.yaml
        outputs:
          - name: depVersion
            fromExpression: dependencies[0].version
          - name: chartVersion
            fromExpression: version
    
    - uses: http
      config:
        url: ${{ "{{" }} vars.gitApiUrl {{ "}}" }}/repos/trawler/kargo-demo/git/refs
        method: POST
        headers:
          Authorization: Bearer ${{ "{{" }} vars.gitApiToken {{ "}}" }}
          Accept: application/vnd.github.v3+json
        body: |
          {
            "ref": "refs/tags/${{ "{{" }} vars.appName {{ "}}" }}-v${{ "{{" }} steps.parse-version.outputs.depVersion {{ "}}" }}",
            "sha": "${{ "{{" }} commitFrom(vars.repoURL).ID {{ "}}" }}"
          }

---
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: update-applicationset
  namespace: {{ .Values.kargo.project.name }}
spec:
  steps:
    - uses: git-clone
      config:
        repoURL: ${{ "{{" }} vars.repoURL {{ "}}" }}
        checkout:
          - branch: main
            path: ./src
    
    - uses: yaml-update
      config:
        path: ./src/${{ "{{" }} vars.applicationsetFiles[0] {{ "}}" }}
        updates:
          - key: .spec.generators[0].list.elements[] | select(.appName == "${{ "{{" }} freight.tag | split("-v")[0] {{ "}}" }}") | .appRevision
            value: ${{ "{{" }} freight.tag {{ "}}" }}
    
    - uses: git-commit
      config:
        message: "chore(${{ "{{" }} freight.tag | split("-v")[0] {{ "}}" }}): update to ${{ "{{" }} freight.tag {{ "}}" }}"
    
    - uses: git-push
      config:
        branch: main
{{- end }}