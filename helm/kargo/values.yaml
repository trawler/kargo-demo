# Kargo Helm Chart values
# All values should be nested under 'kargo' key since kargo is a subchart dependency
kargo:
  controller:
    enabled: true
    logLevel: INFO

  api:
    enabled: true
    replicas: 1
    host: localhost
    logLevel: INFO
    logFormat: CONSOLE
    secretManagementEnabled: true
    permissiveCORSPolicyEnabled: false
    service:
      type: LoadBalancer
    adminAccount:
      enabled: true
      # Default credentials for dev/test - override in cluster-specific values for production
      passwordHash: "$2y$10$BnVJLSysDD/PIwdXaRRI.OPtjwh2U0TTdmT/Ju4euv0ql8BSchG76"
      tokenSigningKey: "i8flMsztEUD656zGakWrt7Fw1grWT5VCecRkOKiBrNw="
      tokenTTL: 24h
    oidc:
      enabled: false

  webhooks:
    enabled: true
    logLevel: INFO

  serviceAccount:
    create: true
    name: kargo-controller

  namespace: kargo

  global:
    clusterSecretsNamespace: kargo-cluster-secrets

  # Kargo Project configuration
  project:
    enabled: true
    name: msvc-system

  # Warehouse configuration
  warehouse:
    enabled: true
    name: msvc-system-warehouse
    repoURL: https://github.com/trawler/kargo-demo.git
    interval: 1m0s
    # branch and allowTags are set per-environment in values.stage-control.yaml and values.prod-control.yaml

  # Git API configuration for tag creation and PR creation
  gitApi:
    url: https://api.github.com  # or https://gitlab.com/api/v4 for GitLab
    repoOwner: trawler  # GitHub/GitLab organization or user
    repoName: kargo-demo  # Repository name
    # Token stored in Kubernetes Secret: git-api-token

  # Version extraction defaults
  versionExtraction:
    defaultExpressions:
      - name: depVersion
        fromExpression: dependencies[0].version
        priority: 1
      - name: chartVersion
        fromExpression: version
        priority: 2
    defaultStripPrefix: true

  # Per-app configuration
  apps:
    # Default promotion tasks for all apps (can be overridden per app)
    _default:
      promotionTasks:
        # Default: Only update controlApps (for control-only apps like kargo, argo-cd-applicationsets)
        - update-applicationset-control
    cert-manager:
      enabled: true
      name: cert-manager
      # cert-manager exists in both controlApps and workloadApps, so run both tasks
      promotionTasks:
        - update-applicationset-control
        - update-applicationset-workload

