{{ if eq .Values.global.argoApp.environment "prod" }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: prod-control-workload-clusters
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: argocd
    app.kubernetes.io/instance: argocd-cd
spec:
  generators:
    - matrix:
        generators:
        - list:
            elements:
{{- if and .Values.workloadClusters (gt (len .Values.workloadClusters) 0) }}
{{- range .Values.workloadClusters }}
              - cluster: {{ .cluster }}
                server: {{ .server }}
                environment: prod
                clusterType: workload
                nodesCidr: {{ .nodesCidr }}
                apiserver: {{ .apiserver }}
                apiserverIp: {{ .apiserverIp }}
{{- end }}
{{- else }}
              []
{{- end }}
        - list:
            elements:
{{- if and .Values.workloadApps (gt (len .Values.workloadApps) 0) }}
{{- range $appName, $appConfig := .Values.workloadApps }}
              - appName: {{ $appName }}
                appRevision: {{ $appConfig.appRevision }}
{{- end }}
{{- else }}
              []
{{- end }}
  goTemplate: true
  goTemplateOptions:
  - missingkey=error
  template:
    metadata:
      name: '{{ "{{" }}.appName{{ "}}" }}-{{ "{{" }}.cluster{{ "}}" }}'
      annotations:
        kargo.akuity.io/authorized-stage: msvc-system:{{ "{{" }}.environment{{ "}}" }}
    spec:
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      project: 'msvc-system'
      source:
        path: apps/{{ "{{" }}.appName{{ "}}" }}
        repoURL: https://github.com/trawler/kargo-demo.git
        targetRevision: '{{ "{{" }}.appRevision{{ "}}" }}'
        helm:
          parameters:
            - name: argoApp.name
              value: '{{ "{{" }}.appName{{ "}}" }}-{{ "{{" }}.cluster{{ "}}" }}'
            - name: argoApp.project
              value: 'msvc-system'
            - name: argoApp.cluster
              value: '{{ "{{" }}.cluster{{ "}}" }}'
            - name: argoApp.server
              value: '{{ "{{" }}.server{{ "}}" }}'
            - name: argoApp.path
              value: '{{ "{{" }}.appName{{ "}}" }}'
            - name: argoApp.revision
              value: '{{ "{{" }}.appRevision{{ "}}" }}'
            - name: argoApp.namespace
              value: 'argocd'
            - name: argoApp.environment
              value: '{{ "{{" }}.environment{{ "}}" }}'
            - name: argoApp.nodes.cidr
              value: '{{ "{{" }}.nodesCidr{{ "}}" }}'
            - name: argoApp.clusterType
              value: '{{ "{{" }}.clusterType{{ "}}" }}'
            - name: argoApp.apiserver.cidr
              value: '{{ "{{" }}.apiserverIp{{ "}}" }}'
            - name: argoApp.apiserver.server
              value: '{{ "{{" }}.apiserver{{ "}}" }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - Replace=true
{{ end }}
