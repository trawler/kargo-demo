postgresqlClusters:
  enabled: false

# Workload cluster configuration (defaults - overridden by environment-specific values files)
# For kind clusters, use static IPs. For POC/metakube, override with actual cluster info.
workloadClusters: []

# Control cluster apps (defaults - overridden by environment-specific values files)
controlApps:
  cert-manager:
    appRevision: main
  argo-cd-applicationsets:
    appRevision: main
  kargo:
    appRevision: main

# Workload cluster apps (defaults - overridden by environment-specific values files)
workloadApps:
  cert-manager:
    appRevision: main
