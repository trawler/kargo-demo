postgresqlClusters:
  enabled: false

# Control cluster apps (defaults - overridden by environment-specific values files)
controlApps:
  - appName: cert-manager
    appRevision: main
  - appName: argo-cd-applicationsets
    appRevision: main
  - appName: kargo
    appRevision: main

# Workload cluster apps (defaults - overridden by environment-specific values files)
workloadApps:
  - appName: cert-manager
    appRevision: main
